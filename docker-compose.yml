services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lxl_low_code
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主机 3307 -> 容器 3306，避开本机 MySQL97 占用的 3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内走 compose 网络，用服务名和容器内部端口
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    volumes:
      - ./app:/app/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
