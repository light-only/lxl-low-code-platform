# 生产/测试服务器使用的 compose 文件（自包含，不依赖仓库里的开发版 compose）
#
# 使用方式：
#   IMAGE=registry.example.com/lxl-low-code-platform-backend:main-42 \
#     docker compose -f docker-compose.prod.yml run --rm migrate
#   IMAGE=... docker compose -f docker-compose.prod.yml up -d --no-deps api
#
# 推荐直接用 deploy/deploy.sh，它把备份、迁移、启动、健康检查和回滚串起来了。
#
# 服务器上需要准备：
#   /srv/lxl-staging/.env                环境变量（见 .env.example）
#   /srv/lxl-staging/docker-compose.prod.yml
#   /srv/lxl-staging/deploy/deploy.sh

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?服务器 .env 必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-lxl_low_code}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?服务器 .env 必须设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # 只监听本机，不对外暴露数据库端口
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 一次性迁移容器：跑完即退出，不常驻。
  # 由 deploy.sh 调用，也可以单独执行：
  #   IMAGE=... docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ${IMAGE:?必须通过 IMAGE 指定要部署的镜像}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGE:?必须通过 IMAGE 指定要部署的镜像}
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
