name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "部署环境（none 只构建镜像，不做部署）"
        type: choice
        options: [none, staging, production]
        default: none

# 推送镜像到 GHCR 需要 packages: write
permissions:
  contents: read
  packages: write

# 同一分支串行执行，避免两个部署同时跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. 代码检查 + 单测 + 迁移校验（真实 MySQL）
  # ---------------------------------------------------------------------------
  ci:
    name: Lint / Test / Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lxl_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码检查
        run: ruff check app migrations

      - name: 单元测试（内存 SQLite）
        run: pytest -q

      - name: 迁移校验（真实 MySQL）
        env:
          DB_TYPE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DB: lxl_ci
        run: |
          alembic upgrade head
          # 模型改了却没生成迁移时，这一步会失败
          alembic check
          alembic current

  # ---------------------------------------------------------------------------
  # 2. 构建并推送镜像到 GHCR（仅 main 分支）
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名与 tag
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "镜像: $IMAGE:$TAG"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. 部署测试环境
  #    - push main 自动触发
  #    - 手动选择 staging / production 也会先走这里
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    needs: build-and-push
    # STAGING_HOST 未配置时跳过，避免服务器还没准备好就报红
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.STAGING_HOST != '' &&
      (github.event_name == 'push' ||
       inputs.deploy_env == 'staging' ||
       inputs.deploy_env == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: 部署
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "cd /srv/lxl-staging && git pull --ff-only && IMAGE=$IMAGE:$TAG ./deploy/deploy.sh staging $IMAGE:$TAG"

  # ---------------------------------------------------------------------------
  # 4. 部署生产环境
  #    - 仅手动触发且选择 production
  #    - 需要在 GitHub 仓库 Settings → Environments → production 配置审批人
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production
    needs: [build-and-push, deploy-staging]
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PROD_HOST != '' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_env == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: 部署
        env:
          HOST: ${{ vars.PROD_HOST }}
          USER: ${{ vars.PROD_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "cd /srv/lxl-production && git pull --ff-only && IMAGE=$IMAGE:$TAG ./deploy/deploy.sh production $IMAGE:$TAG"
